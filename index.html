<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>תרגילי לסת</title>

  <!-- Home Screen app (iOS) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="תרגילי לסת">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1312" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
  <!-- Bump ?v= on every change so phones don't reuse a cached old copy -->
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

  <!-- Welcome -->
  <main id="welcome-screen" class="screen screen-welcome">
    <div class="welcome-inner">
      <div class="emblem" aria-hidden="true">
        <span class="emblem-ring emblem-ring-outer"></span>
        <span class="emblem-ring"></span>
        <svg class="emblem-face" viewBox="0 0 120 120">
          <path d="M34 58 C34 30 46 20 60 20 C74 20 86 30 86 58 C86 82 74 100 60 100 C46 100 34 82 34 58 Z"/>
          <path d="M46 54 Q50.5 58 55 54 M65 54 Q69.5 58 74 54"/>
          <path d="M60 60 Q57 69 60 71"/>
          <path d="M52 81 Q60 87 68 81" class="emblem-smile"/>
        </svg>
      </div>
      <p id="welcome-date" class="eyebrow"></p>
      <h1 id="welcome-greeting" class="welcome-greeting"></h1>
      <p class="welcome-text">כמה דקות של תרגול, בשביל לסת רגועה וחזקה.</p>
      <p id="welcome-progress" class="welcome-progress" hidden></p>
    </div>
    <button id="start-btn" class="btn btn-primary btn-start" type="button">
      <span>Let's Start</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </main>

  <!-- Exercise list -->
  <main id="list-screen" class="screen" hidden>
    <header class="list-header">
      <p id="today-date" class="eyebrow"></p>
      <h1>תרגילי לסת</h1>
      <div class="progress">
        <p class="progress-text"><span id="progress-count">0</span> מתוך <span id="progress-total">6</span> הושלמו היום</p>
        <div class="progress-bar"><span id="progress-fill"></span></div>
      </div>
    </header>
    <ul id="exercise-list" class="exercise-list"></ul>
  </main>

  <!-- Exercise detail -->
  <main id="exercise-screen" class="screen screen-detail" hidden>
    <header class="detail-top">
      <button id="back-btn" class="icon-btn" type="button" aria-label="חזרה לרשימה">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <p id="ex-position" class="eyebrow"></p>
    </header>

    <figure class="hero">
      <img id="ex-image" src="" alt="">
    </figure>

    <h2 id="ex-title" class="detail-title"></h2>
    <p id="ex-description" class="detail-description"></p>

    <section class="counter-section">
      <div class="counter-wrap">
        <svg id="ring" class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-track" cx="60" cy="60" r="56"/>
          <circle id="ring-fill" class="ring-fill" cx="60" cy="60" r="56"/>
        </svg>
        <button id="counter-btn" class="counter-btn" type="button">
          <span id="counter-label" class="counter-label">Counter</span>
          <span id="counter-value" class="counter-value">0</span>
          <span id="counter-goal" class="counter-goal"></span>
        </button>
      </div>

      <div id="hold" class="hold">
        <p class="hold-readout">
          <span id="hold-value" class="hold-value">0</span>
          <span id="hold-total" class="hold-total">מתוך 10 שניות</span>
        </p>
        <p id="hold-status" class="hold-status"></p>
      </div>
    </section>

    <footer class="action-bar">
      <div class="action-bar-inner">
        <button id="reset-btn" class="btn btn-ghost" type="button">איפוס</button>
        <button id="done-btn" class="btn btn-primary" type="button">Done</button>
      </div>
    </footer>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
